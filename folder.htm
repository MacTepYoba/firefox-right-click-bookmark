<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить папку</title>
  <link rel="stylesheet" href="folder.css">
  <script src="folder.js" defer></script>
</head>
<body>
  <main>
    <label for="title">Название</label>
    <input id="title" type="text" maxlength="1000" autocomplete="off">
    <div id="error" role="alert"></div>
    <div class="buttons">
      <button id="cancel" type="button">Отмена</button>
      <button id="save" type="button" class="primary">Добавить</button>
    </div>
  </main>
</body>
</html>
